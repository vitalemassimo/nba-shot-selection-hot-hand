# Every tunable value in the project lives here. No magic numbers in notebooks or src/.
# Each value is justified in docs/decisions.md. Changing a value after Stage 4 needs a logged reason.

random_seed: 20261014

data:
  seasons: ["2018-19", "2019-20", "2020-21", "2021-22", "2022-23", "2023-24", "2024-25", "2025-26"]
  season_types: ["Regular Season", "Playoffs"]
  flagged_seasons:            # kept in the sample, carried as a flag column (decision D-003)
    "2019-20": "bubble_playoffs"
    "2020-21": "shortened_schedule"
  # Approximate expected field-goal attempts per season, used only as a sanity range (Stage 2.6)
  expected_fga:
    regular_season: [150000, 240000]
    playoffs: [8000, 25000]
  nba_api:
    timeout_seconds: 60
    sleep_between_requests_seconds: 1.5
    max_retries: 5
    backoff_base_seconds: 4

pairs:
  max_gap_game_seconds: 240     # max game-clock seconds between two shots to count as a pair (D-006)
  same_period_only: false       # primary spec allows pairs across a period break; tested in Stage 7
  # D-024: a pair is left out when either shot is one of these (putbacks and tips)
  excluded_action_types: ["Tip Layup Shot", "Putback Layup Shot", "Tip Dunk Shot", "Putback Dunk Shot"]
  # D-018: heaves = shots from this distance or more, in the last N seconds of periods 1-3
  heave_min_distance_ft: 36
  heave_seconds_remaining: 3
  heave_max_period: 3
  heave_breaks_pair: true       # D-018 as confirmed; see the open question raised in Stage 4

segments:
  veteran_min_season_number: 10 # veteran = 10th NBA season or later (D-008)
  usage_min_fga_season: 100     # min FGA in a player-season to enter usage tiers
  usage_tiers: 3                # tertiles of FGA per game within season
  cluster_min_fga_season: 200   # min calibration-half regular-season shots to be clustered (D-034)
  cluster_k: 4                  # D-033; k = 3 and 4 stable, 5-7 not
  cluster_k_candidates: [3, 4, 5, 6, 7]
  cluster_stability_seeds: 20
  cluster_bootstrap_resamples: 100

features:
  # D-027: leave-one-out baseline group; baseline shots = the analysis population
  # (no heaves, putbacks, tips or backcourt shots)
  baseline_group: ["player_id", "season", "season_type", "half"]
  distance_column: "coord_distance_ft"   # D-028: distance from x/y coordinates

split:
  calibration_fraction: 0.5     # games (not shots), drawn within each season x season type (D-025)

xfg:
  features: ["shot_distance", "shot_zone_basic", "shot_type", "action_type", "shot_angle"]
  model: "logistic"             # D-032: logistic over gradient boosting
  min_action_count: 500         # rarer action types pooled into "Other" (counted on calibration data)
  # Never include the previous shot's result as a feature.

core:
  # D-037: Model 2 context controls (playbook 4.7)
  margin_bins: [-100, -15, -6, -1, 0, 5, 14, 100]   # shooter's score margin before the shot
  shot_number_cap: 15           # attempt number in the game, capped (few players take more)

inference:
  n_permutations: 1000
  alpha: 0.05
  min_players_per_cell: 30
  min_pairs_per_cell: 2000
  multiple_testing: "holm"      # applied across the H1-H4 family on next-shot distance

robustness:
  pair_gap_variants_seconds: [60, 120, 240, 480, null]   # null = no limit
  min_fga_variants: [50, 100, 200]
  heave_seconds_remaining: 3    # shots in the last N seconds of a period are "heaves"
  garbage_time_margin: 20       # 4th quarter, |score margin| >= this ... (D-022)
  garbage_time_minutes_left: 5  # ... and this many minutes or fewer left
  # Survival rule (D-045): sign positive in every counted variation AND 95% CI contains the baseline in >= 80%
  survival_share: 0.8
  bootstrap_draws: 200          # player bootstrap for the standard-error variation
