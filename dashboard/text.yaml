# Every word a visitor reads on the dashboard. Written by Massimo (docs/ownership.md, Stage 8).

title: "NBA shot selection after makes and misses"

headline:
  question: "What happens to a player's next shot after a make vs a miss?"
  # From Massimo's H0 result (docs/hypotheses.md)
  finding: >-
    After a missed shot, most players will move closer to the basket on their next attempt to try
    and find an easier shot, and after a made shot, they move farther out, probably moved by
    confidence. Put together, the next shot after a make is 1.5 ft (46 cm) farther than after a
    miss (95% interval 1.4 to 1.6 ft), and its shot mix holds 5.4 points more threes and 5.2
    points fewer rim attempts.
  hot_hand: >-
    The data reveals no hot hand: a player is not more likely to make his subsequent shot after a
    make if the difficulty of the shot and the sequence bias are taken into consideration.
  make_prob_label: "**Make probability after a make** (vs a miss, bias-corrected)"
  forest_caption: |-
    Each dot is a group’s shift: the next shot’s distance after a make minus after a miss, in feet, with its 95% interval. The number of pairs is in brackets, and the grey line at 0 marks no shift.

explorer:
  question: "Does that shift differ by player group, and for which outcome?"
  help: |-
    Pick a group and an outcome: shot distance, or the share of rim, paint, mid-range, corner-three, above-the-break-three or all three-point attempts. The two bars show the next shot after a miss and after a make, each measured against the player’s own usual shot. The big number is the shift, with its 95% interval and the number of pairs and players behind it.

shotmap:
  # Labels added 2026-10-16 for more descriptive charts; approved by Massimo
  hover: "Distance from the basket: {dist}<br>Share of next shots in this square: {make} after a make, {miss} after a miss<br>Difference: {diff} percentage points<br>Shots in this square: {n_make} after a make, {n_miss} after a miss"
  colorbar: "Make − miss (pp)"
  question: "Where on the court does the next shot come from after a make vs a miss?"
  help: |-
    Each square is 2 × 2 ft. The colour shows the share of next shots in that square after a make minus the share after a miss, in percentage points: red means more often after a make, blue more often after a miss. Only squares with 50 or more shots on each side are shown. For all players together, red appears just beyond the arc and blue at the rim.

players:
  # Labels added 2026-10-16 for more descriptive charts; approved by Massimo
  map_title: "Where this player's next shot goes after a make vs a miss"
  map_note: "Each 6 × 6 ft square shows the share of this player's next shots taken there after a make minus after a miss, in percentage points. Only squares with at least 5 shots on each side are shown, so parts of the court stay empty and each square rests on few shots."
  compare_title: "Is this player's overall shift unusual for his groups?"
  compare_axis: "Next shot after a make minus after a miss: distance vs own usual shot (ft, 95% interval)"
  this_player: "This player-season (simple difference)"
  group_suffix: "(group, full model)"
  question: "How does one player's shift compare with his group's?"
  warning: |-
    Individual estimates rest on a few hundred shots, so their intervals are wide. Only 844 player-seasons qualify (at least 100 pairs after a make and 100 after a miss). A player’s number is a simple difference with no controls, while the group numbers come from the full model. The list is alphabetical on purpose: it is not a ranking and does not show who is “hottest”.

method:
  summary: |-
    The data cover 8 seasons (2018-19 to 2025-26), regular season and playoffs, about 1.8 million shots. A pair is two consecutive shots by the same player in the same game, at most 4 minutes of game clock apart. Putbacks, tips, heaves and backcourt shots are left out. Each next shot is compared with that player’s own usual shot. Games were split at random into two halves: one half built the difficulty model and the playstyles, and the other ran every test. The model controls for where the previous shot was taken and how hard it was, the game situation and the player-season. The results were checked with a second model and a shuffle test.
  streak_bias: |-
    In short sequences of shots, simply comparing shots after a make with shots after a miss gives a biased answer (Miller and Sanjurjo, 2018). To correct for this, the order of each player’s shots within a game was shuffled 1,000 times, and the real result was compared with the shuffled ones.
  # From Massimo's README robustness paragraph
  robustness: >-
    In short, the result is robust in direction, but its size depends on how consecutive shots are
    defined.
  limitations: |-
    There is no defender data, so shot difficulty means location only. Free throws do not appear in the shot sequence.

    * The study is observational, so it cannot show that a miss causes the shift.
    * The size of the shift depends on how close in time two shots must be: about 2.0 ft within 60 seconds and 1.2 ft with no limit.
    * The placebo test was small but not zero (+0.07 ft), so some leftover confounding is possible.
    * The data cover one league and 8 seasons.
  data_credit: |-
    Shots and play-by-play data come from NBA.com, via the nba_api package and the shufinskiy/nba_data bulk dataset. All-Star rosters come from Wikipedia. Raw data is not redistributed. This project is not affiliated with or endorsed by the NBA.

downloads:
  intro: |-
    Six CSV files: the core, segment and robustness results, plus the three tables behind the Explorer, the shot map and the player lookup. Every number on the dashboard comes from one of these files.
